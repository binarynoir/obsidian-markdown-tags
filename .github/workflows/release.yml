name: Release Obsidian Plugin

on:
    push:
        tags:
            - "*"

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22.x"
                  cache: npm

            - name: Check tag matches manifest version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  manifest="$(node -p "require('./manifest.json').version")"
                  if [ "$tag" != "$manifest" ]; then
                    echo "Tag '$tag' does not match manifest.json version '$manifest'" >&2
                    exit 1
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build plugin
              run: npm run build

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --generate-notes \
                    main.js manifest.json styles.css
